name: "Terraform IAC"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**
env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.6.3
  TERRAFORM_WORKING_DIR: terraform
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  EKS_CLUSTER_NAME: vprofile-eks

  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: terraform-init
        run: terraform init \
          -backend-config="bucket=${{ env.BUCKET_TF_STATE }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform format
        id: terraform-fmt
        run: terraform fmt -check    

      - name: Terraform Validate
        id: terraform-validate
        run: terraform validate  

      - name: Terraform Plan
        id: terraform-plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true

      - name: Terraform plan status
        id: plan-status
        if: steps.terraform-plan.outcome == 'failure'
        run: echo "Terraform plan failed" && exit 1


      # - name: Terraform Apply
      #   if: github.ref == 'refs/heads/main'
      #   working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
      #   run: terraform apply -auto-approve -var="region=${{ env.AWS_REGION }}" -var="clusterName=${{ env.EKS_CLUSTER_NAME }}"